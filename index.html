<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="人事になって人を採用する。三年後、採らなかった11人と答え合わせをする採用シミュレーション。">
<meta property="og:title" content="慧眼採用課">
<meta property="og:description" content="あなたには、人を見る目がある。少なくとも、あなたはそう思っている。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://keigan-recruit.yhiokd.workers.dev">
<meta property="og:image" content="https://keigan-recruit.yhiokd.workers.dev/og-top.png">
<meta name="twitter:card" content="summary_large_image">
<style>html{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>慧眼採用課</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Shippori+Mincho+B1:wght@600;800&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
:root{
  --desk:#E2E6E1;--paper:#FCFCFA;--paper-2:#F2F4F0;--ink:#1B1E22;--ink-2:#5B6268;--ink-3:#8A9196;
  --rule:#CBD2CD;--rule-2:#E3E7E3;--shu:#C23B22;--shu-soft:rgba(194,59,34,.09);
  --fusen:#F4DD62;--fusen-ink:#2B2715;--memo:#2A4B8C;--ok:#2E7550;--ng:#A33A26;
  --bar:#3E5E57;--bar-2:#B9C4BF;--veil:rgba(20,24,22,.55);
  --shadow:0 1px 0 rgba(20,30,25,.05),0 8px 20px -12px rgba(20,30,25,.35);
  --f-disp:'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho',serif;
  --f-body:'BIZ UDPGothic','Hiragino Sans','Yu Gothic',system-ui,sans-serif;
  --f-num:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--desk:#13171A;--paper:#1C2124;--paper-2:#242A2E;--ink:#E6E8E3;--ink-2:#9CA4A8;--ink-3:#6E777C;
  --rule:#3A4348;--rule-2:#2C3337;--shu:#E35E45;--shu-soft:rgba(227,94,69,.13);
  --fusen:#CBB24A;--fusen-ink:#1D1A0C;--memo:#95AFE6;--ok:#62BA8C;--ng:#E58B75;--bar:#8FB3A8;--bar-2:#3F4A4E;--veil:rgba(0,0,0,.65);
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 24px -12px rgba(0,0,0,.7);}}
:root[data-theme="dark"]{
  color-scheme:dark;--desk:#13171A;--paper:#1C2124;--paper-2:#242A2E;--ink:#E6E8E3;--ink-2:#9CA4A8;--ink-3:#6E777C;
  --rule:#3A4348;--rule-2:#2C3337;--shu:#E35E45;--shu-soft:rgba(227,94,69,.13);
  --fusen:#CBB24A;--fusen-ink:#1D1A0C;--memo:#95AFE6;--ok:#62BA8C;--ng:#E58B75;--bar:#8FB3A8;--bar-2:#3F4A4E;--veil:rgba(0,0,0,.65);
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 24px -12px rgba(0,0,0,.7);}

*{box-sizing:border-box}
body{background:var(--desk);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.75;padding-inline:16px;padding-block:0 120px}
.wrap{max-width:1100px;margin-inline:auto}
h1,h2,h3{font-family:var(--f-disp);font-weight:800;text-wrap:balance;line-height:1.35;margin:0}
p{margin:0}
button{font:inherit;color:inherit}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--memo);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:flex-end;justify-content:space-between;padding-block:28px 18px;border-bottom:1px solid var(--rule);margin-bottom:22px}
.brand h1{font-size:30px;letter-spacing:.12em}
.brand p{color:var(--ink-2);font-size:13px;margin-top:2px}
.approve{display:grid;grid-template-columns:repeat(5,56px);border:1px solid var(--ink-2);background:var(--paper)}
.approve div{border-left:1px solid var(--rule);text-align:center}
.approve div:first-child{border-left:0}
.approve .lb{font-size:11px;letter-spacing:.2em;border-bottom:1px solid var(--rule);padding-block:2px;color:var(--ink-2)}
.approve .bx{height:48px;display:grid;place-items:center}
.approve .done .bx span{width:34px;height:34px;border:2px solid var(--shu);border-radius:50%;color:var(--shu);font-family:var(--f-disp);font-weight:800;font-size:13px;display:grid;place-items:center;transform:rotate(-12deg)}
.approve .cur .bx span{width:34px;height:34px;border:1.5px dashed var(--ink-3);border-radius:50%}
.approve .cur .lb{color:var(--ink);font-weight:700}

.fusen{background:var(--fusen);color:var(--fusen-ink);padding:14px 18px;max-width:640px;box-shadow:var(--shadow);transform:rotate(-.6deg);font-size:14.5px;line-height:1.8}
.fusen b{font-weight:700}
.bar-row{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:center;justify-content:space-between;margin-block:18px}

.btn{border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);padding:10px 22px;border-radius:2px;cursor:pointer;font-weight:700;letter-spacing:.06em}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.red{background:var(--shu);border-color:var(--shu);color:#fff;text-decoration:none;display:inline-block}
.btn.small{padding:5px 12px;font-size:13px;letter-spacing:.02em}
.count{font-family:var(--f-num);font-size:14px;color:var(--ink-2)}
.count b{color:var(--shu);font-size:20px}
.linkbtn{background:none;border:0;padding:0;color:var(--memo);text-decoration:underline;cursor:pointer;font-size:12.5px}

.setup{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:32px;align-items:start}
@media (max-width:820px){.setup{grid-template-columns:1fr}}
.intro h2{font-size:clamp(28px,5vw,44px);line-height:1.3;letter-spacing:.02em}
.intro .sub{font-family:var(--f-disp);font-size:20px;color:var(--ink-2);margin-top:10px}
.intro ol{margin:26px 0 0;padding:0;list-style:none;border-top:1px solid var(--rule)}
.intro li{display:grid;grid-template-columns:5.5em 1fr;gap:10px;padding-block:9px;border-bottom:1px solid var(--rule);font-size:14px}
.intro li span:first-child{font-family:var(--f-disp);font-weight:800}
.intro li span:last-child{color:var(--ink-2)}
.repbox{margin-top:20px;background:var(--paper);border:1px solid var(--rule);padding:12px 16px;font-size:14px;display:grid;gap:4px}
.stars-s{color:var(--shu);letter-spacing:2px}
.form{background:var(--paper);box-shadow:var(--shadow);padding:22px 22px 26px;display:grid;gap:20px}
.form fieldset{border:0;padding:0;margin:0;display:grid;gap:8px}
.form legend{font-weight:700;font-size:13px;letter-spacing:.12em;color:var(--ink-2);margin-bottom:6px;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;cursor:pointer}
.chip span{display:block;border:1px solid var(--rule);padding:7px 14px;border-radius:2px;font-size:14px;background:var(--paper)}
.chip small{display:block;font-size:11px;color:var(--ink-3);line-height:1.3}
.chip input:checked+span{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.chip input:checked+span small{color:var(--paper);opacity:.75}
.chip input:focus-visible+span{outline:2px solid var(--memo);outline-offset:2px}
.form select,.form input[type=text]{font:inherit;font-size:16px;background:var(--paper-2);color:var(--ink);border:1px solid var(--rule);padding:8px 10px;border-radius:2px;width:100%}
.me{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.me label{font-size:13px;color:var(--ink-2);display:grid;gap:4px}
.note{font-size:12.5px;color:var(--ink-3)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:18px}
.sheet{position:relative;background:var(--paper);box-shadow:var(--shadow);border:1px solid var(--rule-2);padding:0}
.sheet[data-act]{cursor:pointer;transition:transform .15s}
.sheet[data-act]:hover{transform:translateY(-2px)}
.sheet.on{outline:2px solid var(--shu);outline-offset:-2px}
.sheet .hd{display:flex;justify-content:space-between;align-items:baseline;padding:8px 14px;border-bottom:1.5px solid var(--ink)}
.sheet .hd b{font-family:var(--f-disp);letter-spacing:.5em;font-size:15px}
.sheet .hd span{font-family:var(--f-num);font-size:12px;color:var(--ink-3)}
.idrow{display:grid;grid-template-columns:84px 1fr;border-bottom:1px solid var(--rule)}
.photo{border-right:1px solid var(--rule);padding:8px;display:grid;place-items:center}
.photo svg{width:68px;height:auto;display:block}
.idrow dl{margin:0;display:grid}
.idrow dl div{display:grid;grid-template-columns:3.2em 1fr;border-bottom:1px solid var(--rule-2)}
.idrow dl div:last-child{border-bottom:0}
.idrow dt{font-size:11px;color:var(--ink-3);padding:5px 0 5px 8px;border-right:1px solid var(--rule-2)}
.idrow dd{margin:0;padding:4px 10px;font-size:13.5px}
.idrow .nm{font-size:18px;font-family:var(--f-disp);font-weight:800;letter-spacing:.08em}
.tier{display:block;font-size:11px;color:var(--ink-3)}
.flag{display:inline-block;font-size:11px;background:var(--fusen);color:var(--fusen-ink);padding:0 6px;margin-left:6px;border-radius:1px;vertical-align:1px;white-space:nowrap}
.sec{padding:8px 14px;border-bottom:1px solid var(--rule-2)}
.sec:last-of-type{border-bottom:0}
.sec h4{margin:0 0 2px;font-size:11px;letter-spacing:.14em;color:var(--ink-3);font-weight:700}
.sec p,.sec li{font-size:13.5px;line-height:1.7}
.sec .lead{font-weight:700}
.sec ul{margin:0;padding-left:1.1em}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.looks{padding:7px 14px 10px;font-size:12.5px;color:var(--ink-2);background:var(--paper-2)}
.stamp{position:absolute;right:14px;top:44px;width:64px;height:64px;border-radius:50%;border:3px solid var(--shu);color:var(--shu);font-family:var(--f-disp);font-weight:800;font-size:17px;display:grid;place-items:center;transform:rotate(-14deg) scale(.6);opacity:0;transition:.18s;pointer-events:none;background:var(--shu-soft);letter-spacing:.05em}
.on .stamp{opacity:.92;transform:rotate(-14deg) scale(1)}

.theme{background:var(--paper);border:1px solid var(--rule);padding:12px 16px;margin-bottom:18px}
.theme h4{margin:0;font-size:11px;letter-spacing:.14em;color:var(--ink-3)}
.theme p{font-family:var(--f-disp);font-weight:800;font-size:19px}
.who{display:grid;grid-template-columns:60px 1fr auto;gap:12px;align-items:center;padding:10px 14px;border-bottom:1.5px solid var(--ink)}
.who svg{width:56px;height:auto;display:block}
.who .nm{font-family:var(--f-disp);font-weight:800;font-size:17px;letter-spacing:.06em}
.meter{display:flex;gap:3px}
.mrow{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:11.5px;color:var(--ink-3)}
.meter i{width:12px;height:6px;background:var(--rule)}
.meter i.f{background:var(--ink)}
.quote{font-size:14px}
.memo{color:var(--memo);font-size:13px}
.memo li::marker{content:"— "}
.qa{font-size:13px;padding-block:5px;border-top:1px dotted var(--rule)}
.qa:first-of-type{border-top:0}
.qa .qq{color:var(--ink-2);font-size:12px}

.iv{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:22px;align-items:start}
@media (max-width:820px){.iv{grid-template-columns:1fr}}
.qs{display:grid;gap:8px}
.q{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;text-align:left;border:1px solid var(--rule);background:var(--paper);padding:10px 12px;border-radius:2px;cursor:pointer}
.q:hover:not(:disabled){border-color:var(--ink)}
.q:disabled{opacity:.4;cursor:default}
.q.asked{opacity:1;border-color:var(--ink);background:var(--paper-2)}
.q small{font-size:11px;color:var(--ink-3);white-space:nowrap}
.log{background:var(--paper);box-shadow:var(--shadow);padding:6px 18px;min-height:80px}
.log .ex{padding-block:12px;border-bottom:1px solid var(--rule-2)}
.log .ex:last-child{border-bottom:0}
.log .qq{font-size:13px;color:var(--ink-2)}
.log .aa{margin-top:4px}
.aside{color:var(--memo);font-size:13px;margin-top:4px}
.log .empty{color:var(--ink-3);padding-block:18px;font-size:14px}
.rate{margin-top:16px;background:var(--paper);border:1.5px solid var(--ink);padding:14px 18px;display:grid;gap:12px}
.stars{display:flex;gap:4px}
.stars button{background:none;border:0;font-size:28px;line-height:1;cursor:pointer;color:var(--rule);padding:2px}
.stars button.on{color:var(--shu)}
.rate input[type=range]{width:100%;accent-color:var(--shu)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs span{font-size:13px;padding:4px 12px;border:1px solid var(--rule);background:var(--paper)}
.tabs span.cur{border-color:var(--ink);font-weight:700}
.tabs span.dn{color:var(--ink-3);text-decoration:line-through}

.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:16px;align-items:start}
.bcard{background:var(--paper);box-shadow:var(--shadow);border:1px solid var(--rule-2)}
.bcard.ranked{outline:2px solid var(--shu);outline-offset:-2px}
.st{color:var(--shu);letter-spacing:2px}
.rkbadge{font-family:var(--f-disp);font-weight:800;font-size:26px;color:var(--shu);line-height:1}
.minutes{background:var(--paper);box-shadow:var(--shadow);padding:20px 22px;margin-top:20px}
.minutes h3{font-size:20px;letter-spacing:.2em;border-bottom:1.5px solid var(--ink);padding-bottom:6px;margin-bottom:10px}
.line{display:grid;grid-template-columns:7.5em 1fr;gap:12px;padding-block:7px;border-bottom:1px dotted var(--rule);animation:in .5s both}
.line b{font-size:13px}
.line.sys{grid-template-columns:1fr;color:var(--ink-2);font-size:14px}
@keyframes in{from{opacity:.001;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.line{animation:none}.sheet,.stamp{transition:none}}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{border-bottom:1px solid var(--rule-2);padding:7px 8px;text-align:left;vertical-align:middle}
th{font-size:11px;letter-spacing:.1em;color:var(--ink-3);font-weight:700;border-bottom:1.5px solid var(--ink)}
.scroll{overflow-x:auto}
tr.clk{cursor:pointer}
tr.clk:hover td{background:var(--paper-2)}
.pname{display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:center;min-width:15em}
.pname svg{width:34px;height:auto;display:block}
.pname small{display:block;font-size:11.5px;color:var(--ink-3);line-height:1.4}

.hero{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;background:var(--paper);box-shadow:var(--shadow);padding:24px}
@media (max-width:640px){.hero{grid-template-columns:1fr}}
.bigstamp{width:150px;height:150px;border-radius:50%;border:5px solid var(--shu);color:var(--shu);display:grid;place-items:center;text-align:center;transform:rotate(-10deg);font-family:var(--f-disp);font-weight:800;background:var(--shu-soft)}
.bigstamp .r{font-size:44px;line-height:1}
.bigstamp .r small{font-size:16px}
.bigstamp .t{font-size:13px;letter-spacing:.2em;border-top:2px solid var(--shu);padding-top:3px;margin-top:4px}
.hero h2{font-size:clamp(24px,4vw,34px)}
.hero .say{margin-top:8px;color:var(--ink-2);max-width:60ch}
.hero .score{font-family:var(--f-num);margin-top:12px;font-size:14px;color:var(--ink-2)}
.hero .score b{font-size:26px;color:var(--ink)}
.hero .say b{color:var(--shu)}
.hero .bigstamp .r{font-size:58px}
.hero-act{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.how{margin-top:12px;font-size:13px;color:var(--ink-2)}.how summary{cursor:pointer;text-decoration:underline}.how p{margin:6px 0 0;max-width:60ch}.how ol{margin:8px 0 0;padding-left:1.4em;max-width:60ch}.how li{margin:0 0 8px;line-height:1.7}.how li b{color:var(--ink)}
.kgm{margin:30px 0 4px;max-width:460px}
.kgm-bar{position:relative;height:12px;background:linear-gradient(90deg,var(--rule-2),var(--rule));border-radius:6px}
.kgm-bar i{position:absolute;top:50%;transform:translate(-50%,-50%)}
.kgm-bar .dice{width:2px;height:22px;background:var(--ink-3)}
.kgm-bar .me{width:18px;height:18px;border-radius:50%;background:var(--shu);border:3px solid var(--paper);box-shadow:0 0 0 1px var(--shu)}
.kgm-bar .me span{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);font-family:var(--f-num);font-weight:700;color:var(--shu);font-size:13px}
.kgm-lab{position:relative;height:18px;font-size:11px;color:var(--ink-3);margin-top:6px}
.kgm-lab span{position:absolute;top:0}.kgm-lab span:first-child{left:0}.kgm-lab span:last-child{right:0}.kgm-lab span:nth-child(2){transform:translateX(-50%)}
.sect{margin-top:34px}
.sect>h3{font-size:22px;margin-bottom:4px}
.sect>.lede{color:var(--ink-2);font-size:14px;margin-bottom:14px;max-width:70ch}
.years{display:grid;gap:10px}
.yr{display:grid;grid-template-columns:5em 3.2em 1fr;gap:14px;align-items:center;background:var(--paper);padding:12px 16px;border-left:3px solid var(--rule)}
.yr .y{font-family:var(--f-disp);font-weight:800}
.grade{font-family:var(--f-disp);font-weight:800;font-size:26px;text-align:center}
.g-S,.g-A{color:var(--ok)}.g-C,.g-D{color:var(--ng)}.g-B{color:var(--ink-2)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:18px}
.panel{background:var(--paper);box-shadow:var(--shadow);padding:16px 18px}
.panel h4{margin:0 0 10px;font-size:14px}
.rbar{display:grid;grid-template-columns:9.5em 1fr 3.4em;gap:10px;align-items:center;font-size:13px;padding-block:4px}
.rbar .track{position:relative;height:12px;background:var(--paper-2)}
.rbar .track::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;border-left:1px solid var(--ink-3)}
.rbar .fill{position:absolute;top:0;bottom:0;background:var(--bar)}
.rbar .fill.neg{background:var(--ng)}
.rbar.mine .fill{background:var(--shu)}
.axis{display:grid;grid-template-columns:9.5em 1fr 3.4em;gap:10px;font-size:11px;color:var(--ink-3)}
.axis div:nth-child(2){display:flex;justify-content:space-between}
.pbar{height:8px;background:var(--paper-2);width:100px;position:relative}
.pbar i{position:absolute;left:0;top:0;bottom:0;background:var(--bar)}
.tbar{display:grid;grid-template-columns:6.5em 1fr 3em;gap:10px;align-items:center;font-size:13px;padding-block:3px}
.tbar .pbar{width:auto}
.cut{display:inline-block;font-size:11px;border:1px solid var(--rule);padding:0 6px;white-space:nowrap}
.cut.h{border-color:var(--shu);color:var(--shu);font-weight:700}
tr.hired td{background:var(--shu-soft)}
.fate{font-size:12.5px;color:var(--ink-2);min-width:16em}
.hist{display:flex;align-items:flex-end;gap:4px;height:120px;border-bottom:1px solid var(--ink-3);padding-top:14px}
.hist div{flex:1;background:var(--bar);position:relative;min-height:1px}
.hist div.me{background:var(--shu)}
.hist div span{position:absolute;top:-17px;left:0;right:0;text-align:center;font-size:10px;font-family:var(--f-num);color:var(--ink-2)}
.hlab{display:flex;gap:4px}
.hlab span{flex:1;text-align:center;font-size:11px;font-family:var(--f-num);color:var(--ink-3)}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 14px;font-size:14px}
.kv div:nth-child(even){font-family:var(--f-num);text-align:right}
.warn{border-left:3px solid var(--shu);background:var(--shu-soft);padding:10px 14px;font-size:14px;margin-top:12px}
.foot-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.about p{max-width:70ch;color:var(--ink-2);margin:0 0 10px}
.yrs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.yr{background:var(--paper);box-shadow:var(--shadow);padding:14px 16px;display:grid;grid-template-columns:1fr;gap:6px;align-content:start;border-left:0}
.yr .yh{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--ink-3)}
.yr .gr{font-family:var(--f-disp);font-weight:800;font-size:40px;line-height:1;color:var(--ink)}
.yr .gr.S,.yr .gr.A{color:var(--ok)}.yr .gr.D,.yr .gr.C{color:var(--ng)}
.yr .gr.na{font-size:18px;color:var(--ink-3);line-height:1.6}
.yr .cm{font-size:14px}
.yr .bs{font-size:12px;color:var(--ink-3)}
.yr .ev{font-size:13px;color:var(--ng);font-weight:700}
@media (max-width:640px){.yrs{grid-template-columns:1fr}}
.challenge{background:var(--shu);color:#fff;padding:10px 14px;font-weight:700;margin:0 0 14px}.challenge b{font-family:var(--f-num);font-size:22px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--paper);border-top:2px solid var(--ink);box-shadow:0 -8px 20px -12px rgba(0,0,0,.4);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.dock-in{max-width:1100px;margin-inline:auto;display:flex;align-items:center;gap:12px;justify-content:space-between}
.dock-msg{font-size:14px;line-height:1.5;min-width:0}
.dock-msg b{color:var(--shu);font-family:var(--f-num);font-size:18px}
.dock-msg .ok{color:var(--ok);font-weight:700}
.dock-flash{color:var(--ng);font-size:12.5px;font-weight:700;animation:shake .35s}
@keyframes shake{0%,100%{transform:none}30%{transform:translateX(-4px)}60%{transform:translateX(4px)}}
.dock .btn{white-space:nowrap;flex:none}
.dock .btn:not(:disabled){animation:pulse 1.6s ease-in-out 2}
@keyframes pulse{50%{box-shadow:0 0 0 5px var(--shu-soft)}}
@media (max-width:420px){.dock .btn{padding:10px 14px;font-size:14px}.dock-msg{font-size:13px}}
.rate.wait{border-style:dashed;color:var(--ink-3)}
.sheet[data-act]:not(.on) .hd span::after{content:'　押して通過';color:var(--ink-3)}

.reviews{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:14px}
.rv{background:var(--paper);border:1px solid var(--rule-2);padding:12px 16px;display:grid;gap:4px}
.rv .meta{font-size:11.5px;color:var(--ink-3)}
.rv .s{color:var(--shu);letter-spacing:2px;font-size:14px}
.rv p{font-size:14px}
.repline{display:flex;flex-wrap:wrap;gap:10px 28px;align-items:baseline;background:var(--paper);box-shadow:var(--shadow);padding:14px 18px;margin-bottom:14px}
.repline b{font-family:var(--f-num);font-size:22px}

.veil{position:fixed;inset:0;background:var(--veil);z-index:20;display:grid;place-items:start center;overflow-y:auto;padding:max(16px,env(safe-area-inset-top,0px)) 16px 40px}
.modal{background:var(--desk);max-width:760px;width:100%;box-shadow:var(--shadow);margin-top:24px}
.modal .mh{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;background:var(--paper);border-bottom:1.5px solid var(--ink);position:sticky;top:0;z-index:1}
.modal .mh h3{font-size:18px}
.modal .mb{padding:16px;display:grid;gap:14px}
.freeq{margin-top:12px;border:1.5px dashed var(--ink-3);background:var(--paper);padding:12px;display:grid;gap:8px}
.freeq label{font-weight:700;font-size:13px}
.freeq textarea{font:inherit;font-size:16px;background:var(--paper-2);color:var(--ink);border:1px solid var(--rule);padding:8px 10px;border-radius:2px;width:100%;resize:vertical}
.freeq .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.tagfree{display:inline-block;font-size:11px;border:1px solid var(--memo);color:var(--memo);padding:0 6px;margin-left:6px}
.thinking{color:var(--ink-2);font-size:14px;padding-block:12px}
.fqv{padding-block:10px;border-top:1px solid var(--rule-2);font-size:14px}
.fqv:first-child{border-top:0}
.radarwrap{display:grid;grid-template-columns:minmax(0,380px) 1fr;gap:18px;align-items:center}
@media (max-width:640px){.radarwrap{grid-template-columns:1fr}}
.radarwrap svg{width:100%;max-width:380px;height:auto;display:block}
.radar-type{font-family:var(--f-disp);font-weight:800;font-size:22px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-top:8px}
.legend i{display:inline-block;width:18px;height:0;border-top:2px solid var(--shu);vertical-align:middle;margin-right:5px}
.legend i.avg{border-top:2px dashed var(--ink-2)}
.factor{display:grid;grid-template-columns:1fr auto;gap:12px;font-size:13.5px;padding-block:4px;border-bottom:1px dotted var(--rule)}
.factor span:last-child{font-family:var(--f-num)}
.setup-radar{margin-top:16px;background:var(--paper);border:1px solid var(--rule);padding:12px 16px}
.setup-radar .radarwrap{grid-template-columns:1fr}
.setup-radar .radarwrap svg{max-width:300px;margin-inline:auto}

function ask(c,qid){
  const q=qid==='pro'?{...Q.pro,...IND[G.cfg.ind].pro}:Q[qid];const t=c.t;
  const dv=t.cha+.35*gz();c.obs.deliv.push(dv);
  const pre=dv>.6?pick(['（よどみなく、目を見て）','（笑顔で、間を置かずに）','（身振りを交えて）','（面接官の名前を呼んでから）']):dv<-.5?pick(['（少し考えてから、小さな声で）','（視線を落としたまま）','（早口で一気に）','（何度も言い直しながら）']):pick(['（落ち着いた様子で）','','（一呼吸おいて）','']);
  let text,aside='';
  if(qid==='family'){
    text=t.wealth>.7?pick(['「父は医師で、母は会社を経営しています」','「父は弁護士で、母は大学で教えています」']):t.wealth>-.5?pick(['「父は会社員で、母はパートをしています」','「両親とも公務員です」']):pick(['「父は工場に勤めています。母は……早くに亡くなりました」','「母が一人で育ててくれました。スーパーで働いています」']);
    aside='この情報を評価のどこに使うつもりか、メモ欄が静かにこちらを見ている。';G.viol.push({q:qid,id:c.id});
  }else if(qid==='marry'){
    text=pick(['「……それ、答えないといけませんか」','「今のところ予定はありません」（表情が少し固くなった）','「それは、選考に関係ありますか」（まっすぐこちらを見た）']);
    aside='候補者の中で、この会社の順位が一つ下がった音がした。';G.viol.push({q:qid,id:c.id});
  }else if(qid==='hobby'){
    if(c.sameHobby){text=`「実は${c.hobby}が好きで……」`;aside=`あなたも${c.hobby}が好きだ。話が異様に弾み、気づけば10分経っていた。評価項目には関係がない。`;c.obs.rapport=true;}
    else text=dv>.3?pick([`「${c.hobby}です。最近は……」（楽しそうに話した）`,`「${c.hobby}ですね。去年からハマっていて、実は……」（止まらなかった）`]):dv>-.4?`「${c.hobby}をしています」（それ以上は広がらなかった）`:pick([`「${c.hobby}、ですかね……」（会話はそこで終わった）`,`「特に……あ、${c.hobby}とか」`]);
  }else{
    let s=0;for(const k in q.w)s+=q.w[k]*t[k];s+=q.noise*gz();
    const tier=s>.5?'hi':s>-.45?'mid':'lo';
    text=fill(pick(q[tier]),{ep:c.episode});

function simSeat(c,env,r,cfg){
  const S=SIZE[cfg.size],I=IND[cfg.ind];let st='在籍',leave=false,sum=0,worked=0,pen=0;const ys=[];const fit=gz(r)*.8;
  const comp={abil:0,mgr:0,fit:0,luck:0};
  const pLeave=c.gender==='女性'?.05:c.gender==='男性'?.015:.03;
  for(let y=0;y<3;y++){
    if(st!=='在籍'){ys.push(null);continue}
    if(y>0&&!leave&&r()<pLeave){
      leave=true;const back=({big:.85,sme:.7,startup:.55})[cfg.size]+(env.mgr[y]>0?.1:-.1);
      if(r()>back)st='育休後退職';
      ys.push({leave:true,mgr:env.mgr[y]});continue;
    }
    const luck=gz(r)*S.luck;let perf=.65*c.pot+.3*env.mgr[y]+fit+luck;let ev=null;
    comp.abil+=.65*c.pot;comp.mgr+=.3*env.mgr[y];comp.fit+=fit;comp.luck+=luck;
    if(c.t.integ<-1.2&&r()<(I.integ||.2)){perf-=2.2;comp.scan=(comp.scan||0)-2.2;st='懲戒';ev='scandal'}
    let qp=I.quit+S.quit+.07*(-c.t.stay)+(env.mgr[y]<-.7?.1:0)+(perf>1.2&&cfg.size!=='big'?.06:0);
    if(cfg.mode==='mid')qp-=.02;
    sum+=perf;worked++;
    const rec={perf,luck,mgr:env.mgr[y],ev,quit:false};ys.push(rec);
    if(st==='在籍'&&r()<clamp(qp,.02,.6)){st='退職';rec.quit=true;pen=.5}
  }
  // 育休の年は比較から外す：休んだ場合は在籍した年の平均×3、自己都合退職はその時点までの合計
  let total;
  if(leave){const k=worked?3/worked:0;total=sum*k;for(const x in comp)comp[x]*=k;}
  else{total=sum-pen;}
  return {total,ys,st,leave,comp};
}

const NOTES={

  gLo:['途中で論点がずれた','課題を途中から別の課題だと思っていた','同じ質問を二回した'],

const GD_REACT={hi:['「{o}さんの案、前提だけ直せば使えると思います」','「今の意見、もう少し詳しく聞かせてもらえますか」','「私の案は取り下げます。そっちのほうがいいです」','「反対の人の意見も一回聞きませんか」'],mid:['「なるほど、いいですね」','「私もそう思います」','（うなずきながら聞いていた）','「確かに、それもありですね」'],lo:['「いや、それは違うと思います」（食い気味だった）','「さっきも言いましたけど……」','（他の人が話している間、ずっと自分のメモを書いていた）','「それ、意味あります？」']};
function gdRole(c){const h=c.t.cha+.6*gz(),k=c.t.con+.6*gz();if(h>.9)return pick(['司会（自分から立候補）','発表役（自分から立候補）']);if(k>.9)return pick(['書記','タイムキーパー']);if(h>.3)return '発表役（じゃんけんで負けた）';return 'なし'}
function gdNotes(c){
  const t=c.t,o=v=>v+.8*gz();const cand=[];
  const s=o(t.soc),k=o(t.con),g=o(t.g),h=o(t.cha);
  if(s>.6)cand.push([s,pick(NOTES.socHi)]);
  if(s<-.6&&h>.2)cand.push([-s,pick(NOTES.socLo)]);
  if(k>.6)cand.push([k,pick(NOTES.conHi)]);
  if(g>.7)cand.push([g,pick(NOTES.gHi)]);
  if(g<-.8)cand.push([-g,pick(NOTES.gLo)]);
  if(h>.6)cand.push([h,pick(NOTES.chaHi)]);
  if(h<-.6)cand.push([-h,pick(NOTES.chaLo)]);
  let n1=pick(NOTES.neutral),n2=pick(NOTES.neutral);while(n2===n1)n2=pick(NOTES.neutral);
  cand.push([.2+R()*.3,n1],[.1+R()*.2,n2]);
  cand.sort((a,b)=>b[0]-a[0]);return cand.slice(0,3).map(x=>x[1]);
}

function meeting(){
  const fin=G.final.map(id=>G.cands[id]);const cfg=G.cfg;
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
  const sc={
    ceo:c=>.6*(c.obs.talk+avg(c.obs.deliv))+.35*(c.tier-3)/1.2+.35*c.t.attract+(c.taiiku?.7:0)+.3*gz(),
    coo:c=>(c.obs.work!==undefined?c.obs.work:c.obs.pro!==undefined?c.obs.pro:.45*(c.tier-3)/1.2+.4*c.obs.gdC+(cfg.mode==='mid'?.4*c.prest:0))+.25*gz(),
    cfo:c=>cfg.mode==='mid'?-(c.salary-500)/60+.3*gz():-.6*(c.gap==='特になし'?0:1)+.15*c.certs.length+.4*gz(),

    if(k==='coo')say=top.obs.work===undefined&&top.obs.pro!==undefined?`「専門的な質問への答えを見ました。現場で話が通じるのは${nm(top)}さんです」`:top.obs.work!==undefined?`「課題の出来を見ました。現場で使えるのは${nm(top)}さんです」`:`「課題を出していないなら判断材料が少ない。経歴で言えば${nm(top)}さんでしょう」`;
    if(k==='cfo')say=cfg.mode==='mid'?`「${nm(top)}さんの希望年収は${top.salary}万円。一番まともです」`:pick([`「リスクが一番少ないのは${nm(top)}さんです。根拠ですか。勘です」`,`「${nm(top)}さんは資格を持っている。少なくとも勉強はする人です」`]);
    lines.push([who[k],say]);
  }
  // 基本は人事の推薦順。ただし人事の1位が役員の評価で最下位か、役員3人が別の1人をそろって1位に挙げたら、役員の評価順に切り替える
  const hr1=G.rank[0];const byExec=[...fin].sort((a,b)=>pts[b.id]-pts[a.id]||G.rank.indexOf(a.id)-G.rank.indexOf(b.id));
  const lowest=fin.every(c=>c.id===hr1||pts[c.id]>pts[hr1]);

  const overridden=lowest||unanimous;

  lines.push(['sys',overridden?(unanimous?`役員3人がそろって ${G.cands[t[0]].name} を1位に挙げた。人事の推薦より役員の判断を優先する。`:`人事が1位に推した ${G.cands[hr1].name} は、役員の評価で最下位。人事の推薦より役員の判断を優先する。`):'人事の推薦と役員の評価に大きなズレはない。人事の推薦順どおりに内定を出す。']);
  lines.push(['権田 社長',overridden?`「人事の意見はよく分かった。参考にさせてもらったよ。${nm(order[0])}さんで行こう」`:`「人事の目は確かだな。${nm(order[0])}さんで行こう」`]);
  let hired=null;const declined=[];

    const p=clamp(SIZE[cfg.size].accept-.13*Math.max(0,mv)+(c.acceptAdj||0)+(c.obs.rapport?.05:0)+(G.rep0-3.5)*.08,.15,.95);

  }
  if(!hired)lines.push(['sys','3人とも辞退。今期の採用はゼロ。欠員のまま一年が始まる。']);

  <details class="how"><summary>慧眼力の計算方法</summary>
  <p>慧眼力は、人事測定の研究で標準的に使われている指標を、ゲーム用に組み合わせたものです。基準点から、次の4つを足し引きします。</p>
  <ol>
  <li><b>選考の妥当性（±30）</b>　12人それぞれを「どの段階まで進めたか」と「三年間の実際の成績」の順位相関（スピアマンの順位相関係数）。選考を、あとから測った職務成績との相関で評価する「基準関連妥当性」の考え方で、Schmidt &amp; Hunter（1998）やSackettほか（2022）のメタ分析、米国産業・組織心理学会（SIOP）の『人事選考手続の妥当性確認と使用に関する原則』（2018）と同じ方法です。進めた段階は順序にしか意味がないため、順位で相関をとっています。</li>
  <li><b>採用の効用（±16）</b>　採用した人の三年間の成績を、12人の中で標準化した値（z得点）。選考の価値は「採用した人の成績が平均からどれだけ上か」に比例するという、ブログデン＝クロンバック＝グレーザーの効用モデル（Brogden 1949／Cronbach &amp; Gleser 1965）に基づきます。誰も採用できなかった場合は、平均を大きく下回る人を採用したのと同じ扱いです。</li>
  <li><b>確信度の較正（＋4〜−12）</b>　1位に推した人が12人中の上位半分に入るかを、あなたの確信度がどれだけ正確に言い当てたか。気象予報や予測研究で使われるブライアースコア（Brier 1950）で測ります。自信過剰ほど大きく減点される「適切なスコアリングルール」で、Tetlockらの予測研究でも使われています。確信度50%は「わからない」と同じで、加点も減点もありません。</li>
  <li><b>不適切な質問（1回につき−10）</b>　厚生労働省「公正な採用選考の基本」は、本人に責任のない事項や、思想・信条など本来自由であるべき事項を尋ねることを、就職差別につながるおそれがあるとしています。</li>

  out+=`<section class="sect"><h3>同じ席に、他の11人を座らせたら</h3><p class="lede">同じ部署、同じ上司、同じ景気で、12人全員がそれぞれ三年働いた場合の成績順です。「潜在力」はこのゲームが最初から決めていた本当の値で、あなたには一度も見えていません。行を押すと、その人の履歴書・面接記録・本当の姿が開きます。</p>
  <div class="scroll"><table><thead><tr><th>順位</th><th>候補者</th><th>あなたの判断</th><th>評価</th><th>潜在力</th><th>三年の成績</th><th>この席での三年</th></tr></thead><tbody>
  ${sorted.map(c=>{const ct=cutText(c);return `<tr class="clk ${c.id===G.hired?'hired':''}" data-act="open" data-id="${c.id}" tabindex="0" role="button"><td class="num">${c.rank}</td><td><div class="pname">${face(c)}<div>${esc(c.name)}${c.similar?'<span class="flag">共通点</span>':''}<small>${esc(profileLine(c))}</small><small>${esc(hint(c))}</small></div></div></td><td>${ct?`<span class="cut ${c.id===G.hired?'h':''}">${ct}</span>`:''}</td><td style="color:var(--shu);white-space:nowrap">${G.rate[c.id]?'★'.repeat(G.rate[c.id].star):''}</td><td><div class="pbar"><i style="width:${clamp((c.pot/pmx+1)/2*100,3,100)}%"></i></div></td><td><div class="pbar"><i style="width:${clamp((c.res.total/mx+1)/2*100,3,100)}%;background:${c.id===G.hired?'var(--shu)':'var(--bar)'}"></i></div></td><td class="fate">${esc(c.fate)}</td></tr>`}).join('')}
  </tbody></table></div>
  <p class="warn">神の目で本当の潜在力が一番高い人（${esc(X.best.name)}）を選んでいたとしても、この世界線では${X.best.rank}位でした。同じ条件で世界を${X.N}回やり直すと、その人が1位になるのは${Math.round(X.bestFirst/X.N*100)}%です。</p></section>`;
  if(h){const hm=Math.max(...X.hist)||1;const exp=X.hist.reduce((s,v,i)=>s+v*(i+1),0)/X.N;
  out+=`<section class="sect"><h3>乱数の神にもう一度聞く</h3><p class="lede">三年の成績は「本人の能力＋上司＋配属との相性＋運」で決まります。能力があっても、上司や配属が合わなければ成績は出ません。一覧の行を押すと、一人ずつの内訳が見られます。<br>${esc(h.name)}さんを採った事実はそのままに、上司と運と相性だけを${X.N}回引き直しました。赤が今回の世界線の順位です。平均順位は${exp.toFixed(1)}位。</p>
  <div class="panel"><div class="hist">${X.hist.map((v,i)=>`<div class="${i+1===h.rank?'me':''}" style="height:${v/hm*100}%"><span>${Math.round(v/X.N*100)}%</span></div>`).join('')}</div><div class="hlab">${X.hist.map((_,i)=>`<span>${i+1}位</span>`).join('')}</div></div></section>`;}
  const d=X.after-X.before;
  out+=`<section class="sect"><h3>候補者たちは、あなたの会社をこう書いた</h3><p class="lede">就活口コミサイトへの投稿です。あなたが候補者を評価していた間、候補者もあなたを評価していました。</p>
  <div class="repline"><span>御社の評価 <b>${X.before.toFixed(2)}</b> → <b style="color:${d<0?'var(--ng)':'var(--ok)'}">${X.after.toFixed(2)}</b></span><span class="note">次回の応募者：${repLabel(X.after)}${d<-.05?'。少し質が下がり、内定辞退も増えます':d>.05?'。少し良い人が来るようになります':''}</span></div>
  <div class="panel" style="margin-bottom:14px"><h4>評価が動いた理由</h4>${X.factors.length?X.factors.map(([k,v])=>`<div class="factor"><span>${esc(k)}</span><span style="color:${v<0?'var(--ng)':'var(--ok)'}">${v>=0?'+':'−'}${Math.abs(v).toFixed(2)}</span></div>`).join(''):'<p class="note">あなたは特に何もしませんでした。評価もほとんど動きませんでした。</p>'}<p class="note" style="margin-top:8px">評価を動かすのは、落ちた人と辞退した人の感想だけです。採用した人の社員口コミは配属先の上司で決まるので、含めていません。あなたのせいではないので。</p></div>
  ${X.reviews.length?`<div class="reviews">${X.reviews.map(v=>`<div class="rv"><div class="s">${starsTxt(v.stars)}</div><div class="meta">${ageBand(v.c.age)}・${v.c.gender==='未回答'?'性別非公開':v.c.gender}・${v.stage}</div><p>${esc(v.text)}</p><button class="linkbtn" data-act="open" data-id="${v.c.id}" style="justify-self:start">投稿者：${esc(v.c.name)}（あなたにだけ分かる）</button></div>`).join('')}</div>`:'<p class="note">今回は誰も書き込みませんでした。興味すら持たれていない可能性があります。</p>'}</section>`;
  {const t=radarType(X.radar);
  out+=`<section class="sect"><h3>あなたの選考のクセ</h3><p class="lede">あなたが誰をどこまで進めたかを、5つの物差しで見たものです。50は「関係なし」。高いほど、その要素で人を選んでいます。</p>
  <div class="panel"><div class="radarwrap">${radarSvg(X.radar,X.prevAvg)}<div><div class="radar-type">${t[0]}</div><p class="say" style="margin-top:6px">${t[1]}</p>
  ${X.prevAvg?'<div class="legend"><span><i></i>今回</span><span><i class="avg"></i>これまでの平均</span></div>':''}
  <div class="kv" style="margin-top:12px;font-size:12.5px;color:var(--ink-2)"><div>中身</div><div>発言・回答の具体性</div><div>印象</div><div>話のうまさと見た目</div><div>肩書き</div><div>学歴と経歴</div><div>親近感</div><div>母校・趣味の一致</div><div>質問設計</div><div>聞いた質問の予測力</div></div></div></div></div></section>`;}
  if(G.viol.length)out+=`<p class="warn">不適切な質問を${G.viol.length}回しています（${[...new Set(G.viol.map(v=>v.q==='free'?`「${esc(v.text)}」`:Q[v.q].label))].join('、')}）。家族、結婚・出産、出身地、宗教、尊敬する人物などは本人の能力や適性と関係がなく、厚生労働省の「公正な採用選考」の考え方で、聞くべきでない事項とされています。</p>`;
  const H=X.history;const pairs=H.flatMap(r=>r.stars||[]);const rs=pearson(pairs.map(p=>p.s),pairs.map(p=>p.z));
  const ranks=H.filter(r=>r.rank).map(r=>r.rank);const avgR=ranks.length?ranks.reduce((a,b)=>a+b,0)/ranks.length:null;
  const sp=H.reduce((a,r)=>[a[0]+r.sim[0],a[1]+r.sim[1]],[0,0]),op=H.reduce((a,r)=>[a[0]+r.oth[0],a[1]+r.oth[1]],[0,0]);
  const simStars=pairs.filter(p=>p.sim),othStars=pairs.filter(p=>!p.sim);const ms=a=>a.length?a.reduce((x,y)=>x+y.s,0)/a.length:null;
  const confs=H.map(r=>r.conf);const hit=H.filter(r=>r.recRank<=3).length;
  out+=`<section class="sect"><h3>あなたの通算成績</h3><p class="lede">このブラウザでの${H.length}回分です。1回では運ですが、回数を重ねると癖が出ます。</p>
  <div class="cols"><div class="panel"><div class="kv">
  <div>プレイ回数</div><div>${H.length}</div>
  <div>採用した人の平均順位（ランダムなら6.5）</div><div>${avgR?avgR.toFixed(1):'—'}</div>
  <div>あなたの★と三年後の成果の相関</div><div>${rs===null?'データ不足':(rs>=0?'+':'')+rs.toFixed(2)}</div>
  <div>1位推薦の平均確信度</div><div>${Math.round(confs.reduce((a,b)=>a+b,0)/confs.length)}%</div>
  <div>1位推薦が実際に上位3位以内だった率</div><div>${Math.round(hit/H.length*100)}%</div>
  <div>慧眼力の平均／最高</div><div>${(()=>{const k=H.filter(r=>r.kg!==undefined).map(r=>r.kg);return k.length?Math.round(k.reduce((x,y)=>x+y,0)/k.length)+' ／ '+Math.max(...k):'—'})()}</div>
  </div></div>
  <div class="panel"><div class="kv">
  <div>あなたと共通点がある人の書類通過率</div><div>${sp[1]?Math.round(sp[0]/sp[1]*100)+'%':'—'}</div>
  <div>それ以外の人の書類通過率</div><div>${op[1]?Math.round(op[0]/op[1]*100)+'%':'—'}</div>
  <div>共通点がある人への平均★</div><div>${ms(simStars)?ms(simStars).toFixed(2):'—'}</div>
  <div>それ以外の人への平均★</div><div>${ms(othStars)?ms(othStars).toFixed(2):'—'}</div>
  </div><p class="note" style="margin-top:8px">書類の平均通過率は50%です。共通点は、このゲームでは成果と一切関係ありません。</p></div></div></section>
  <section class="sect about"><h3>この評価について</h3>
  <p>本ゲームでは、面接手法と職務成績の相関を調べたメタ分析（Sackett ほか, 2022／Schmidt &amp; Hunter, 1998）や、面接官が自分に似た人を選びやすいことを示した研究（Rivera, 2012）、予測の当たり外れを測る方法（Brier, 1950）、厚生労働省の「公正な採用選考」の考え方などを参考に、あなたの選考を評価しています。</p>
  <p>もっとも、その物差しを選んだのも、配分を決めたのも、このゲームを作った誰かです。あなたが候補者を評価し、部長があなたを評価したように、このゲームの評価もまた、あなたに評価されています。慧眼力が低かったなら、それはあなたの目のせいかもしれないし、このゲームの目のせいかもしれません。どちらなのかを見抜けたら、それがいちばんの慧眼です。</p></section>
  <div class="foot-actions"><a class="btn red" href="${shareHref(X)}" target="_blank" rel="noopener">慧眼力を X でシェア</a><button class="btn" data-act="again">同じ設定で次の採用へ</button><button class="btn ghost" data-act="home">設定を変える</button></div>`;
  return out;
}

/* ============ イベント ============ */
document.addEventListener('submit',e=>{if(e.target.id==='setupForm'){e.preventDefault();start()}});
const smooth=()=>matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth';
function scrollToLog(){if(!matchMedia('(max-width:820px)').matches)return;const el=$('.log .thinking')||[...document.querySelectorAll('.log .ex')].pop();if(el)el.scrollIntoView({behavior:smooth(),block:'start'})}
function restart(){CFG={...G.cfg};G=null;render();setTimeout(()=>{$('#setupForm').requestSubmit()},0)}
function act(el,e){
  const a=el.dataset.act,id=el.dataset.id!==undefined?+el.dataset.id:null;
  if(G)G.flash='';
  if(a==='goqs'){const r=$('.qs');if(r)r.scrollIntoView({behavior:smooth(),block:'start'});return}
  if(a==='gorate'){const r=$('.rate');if(r)r.scrollIntoView({behavior:smooth(),block:'center'});return}
  if(a==='goreason'){const r=$('#reasonBox');if(r)r.scrollIntoView({behavior:smooth(),block:'center'});return}
  if(a==='close'){if(e&&el.classList.contains('veil')&&e.target!==el)return;G.modal=null;render();return}
  if(a==='open'){G.modal=id;render();return}
  if(a==='t1'){if(G.p1.has(id))G.p1.delete(id);else if(G.p1.size<6)G.p1.add(id);else G.flash='通過は6通までです。取り消すには、判子のある履歴書をもう一度押してください。';render();return}
  if(a==='next1'){G.t1=performance.now();go('group');return}
  if(a==='t2'){if(G.p2.has(id))G.p2.delete(id);else if(G.p2.size<3)G.p2.add(id);else G.flash='通過は3人までです。取り消すには、選んだカードをもう一度押してください。';render();return}
  if(a==='next2'){G.final=[...G.p2];G.iv=0;go('iv');return}
  if(a==='ask'){const c=G.cands[G.final[G.iv]];G.asked[c.id]=G.asked[c.id]||[];G.log[c.id]=G.log[c.id]||[];if(G.asked[c.id].length>=3)return;G.asked[c.id].push(el.dataset.q);G.log[c.id].push(ask(c,el.dataset.q));if(!G.rate[c.id])G.rate[c.id]={star:0,conf:70};render();scrollToLog();return}
  if(a==='freeask'){const c=G.cands[G.final[G.iv]];const q=(G.fqDraft||'').trim();if(!q||G.pending)return;G.asked[c.id]=G.asked[c.id]||[];G.log[c.id]=G.log[c.id]||[];if(G.asked[c.id].length>=3||G.asked[c.id].includes('free'))return;
    G.pending=true;G.aiNote='';render();scrollToLog();
    askFree(c,q).then(e=>{G.asked[c.id].push('free');G.log[c.id].push(e);G.fqDraft='';if(!G.rate[c.id])G.rate[c.id]={star:0,conf:70};G.pending=false;render();scrollToLog()});return}
  if(a==='star'){const c=G.cands[G.final[G.iv]];G.rate[c.id].star=+el.dataset.s;render();return}
  if(a==='nextiv'){G.aiNote='';G.fqDraft='';if(G.iv<2){G.iv++;go('iv')}else go('board');return}
  if(a==='rk'){if(!G.board&&!G.rank.includes(id)&&G.rank.length<3){G.rank.push(id);if(G.rank.length===2){const rest=G.final.find(x=>!G.rank.includes(x));G.rank.push(rest)}render();if(G.rank.length===3&&!G.reason){const r=$('#reasonBox');if(r)r.scrollIntoView({behavior:smooth(),block:'center'})}}return}
  if(a==='rkreset'){G.rank=[];render();return}
  if(a==='meet'){meeting();render();const mn=$('.minutes');if(mn)mn.scrollIntoView({behavior:smooth(),block:'start'});return}
  if(a==='toresult'){go('result');return}
  if(a==='again'){restart();return}
  if(a==='home'){CFG={...G.cfg};G=null;render();window.scrollTo({top:0});return}
  if(a==='represet'){REP={score:3.5,n:0};store.set('keigan-rep-v1',REP);render();return}
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||el.tagName==='INPUT')return;
  if(el.classList.contains('veil')&&e.target!==el)return;
  act(el,e)});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&G&&G.modal!=null){G.modal=null;render();return}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=button][data-act]')){e.preventDefault();act(e.target)}
});
document.addEventListener('change',e=>{if(e.target.closest&&e.target.closest('#setupForm')&&['mode','ind','size','uni','hobby','ai'].includes(e.target.name)){CFG[e.target.name]=e.target.value;return}if(e.target.name==='reason'){G.reason=e.target.value;render()}});
document.addEventListener('input',e=>{
  if(e.target.id==='fq'){G.fqDraft=e.target.value;return}
  if(e.target.id==='conf'){const c=G.cands[G.final[G.iv]];G.rate[c.id].conf=+e.target.value;$('#confv').textContent=e.target.value}
});
render();
</script>
